name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1 (Fast Gate - PR & Push): Runs on ubuntu-latest in <60 seconds.
  # Fails fast to abort immediately without wasting matrix runners.
  fast-gate:
    name: Fast Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Formatting (Biome + gofmt)
        run: pnpm run format:check

      - name: Strict Typecheck (TypeScript NodeNext ESM + Go)
        run: pnpm run typecheck

      - name: Strict Linting (Biome Preset All + Go Vet)
        run: pnpm run lint

      - name: Fast Unit & Architecture Invariant Tests
        run: pnpm run test:fast

  # Job 2 (Integration & Host Matrix): Full multi-platform matrix test suite
  integration-matrix:
    name: Full Matrix (${{ matrix.os }})
    needs: fast-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Headless Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Strict Typecheck (${{ matrix.os }})
        run: pnpm run typecheck

      - name: Run Unit & Integration Tests (${{ matrix.os }})
        run: go test -v ./src/... ./tests/... && pnpm run test:client

      - name: Run E2E Flexbox & UI Invariant Tests (${{ matrix.os }})
        run: pnpm run test:e2e
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Verify Clean Build & Binary Packaging (${{ matrix.os }})
        run: pnpm run build

  # Job 3 (Cross-Platform Binaries Build): Builds distributables for Windows, Linux, and macOS
  build-cross-platform:
    name: Build Cross-Platform Binaries
    needs: integration-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all platform binaries (Windows, Linux, macOS)
        run: pnpm run build:all

      - uses: actions/upload-artifact@v4
        with:
          name: agy-boost-binaries
          path: dist/*
          retention-days: 7
