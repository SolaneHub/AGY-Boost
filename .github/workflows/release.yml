name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.0.0)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || '' }}
  cancel-in-progress: true

jobs:
  publish-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all platform binaries
        run: pnpm run build:all

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.event.inputs.tag }}
          files: |
            dist/agy-boost
            dist/agy-boost.exe
            dist/agy-boost-linux
          fail_on_unmatched_files: true
