<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Antigravity Host Environment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #1e1e1e;
      --foreground: #e0e0e0;
      --sidebar-background: #181818;
      --sidebar-secondary: #2d2d2d;
      --sidebar-muted: #252525;
      --secondary: #2a2a2a;
      --secondary-foreground: #cccccc;
      --muted: #2a2a2a;
      --muted-foreground: #888888;
      --border: #333333;
      --primary: #3b82f6;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex">
  <div id="root" class="flex h-full w-full">
    <!-- Sidebar -->
    <aside role="navigation" class="w-64 h-full bg-[#181818] border-r border-[#333333] flex flex-col p-2 shrink-0">
      <div class="p-2 font-bold text-sm text-gray-400">Antigravity</div>
      <div data-testid="sidebar-navigation-items" class="flex flex-col gap-1 mt-2">
        <button data-testid="new-conversation-button" onclick="event.preventDefault();" class="px-3 py-2 rounded-lg text-sm text-left border border-border text-foreground bg-sidebar-secondary font-medium">
          New Chat
        </button>
        <button data-testid="automations-button" class="px-3 py-2 rounded-lg text-sm text-left bg-transparent text-secondary-foreground hover:bg-sidebar-muted hover:text-foreground">
          Automations
        </button>
        <a href="/customizations" onclick="event.preventDefault();" class="px-3 py-2 rounded-lg text-sm text-left bg-transparent text-secondary-foreground hover:bg-sidebar-muted hover:text-foreground">
          Customizations
        </a>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 flex flex-col h-full min-h-0 overflow-hidden relative">
      <!-- Titlebar / Header -->
      <header data-main-content-header="true" class="h-10 border-b border-[#333333] flex items-center justify-between px-3 shrink-0">
        <div class="agy-layout-vars flex items-center gap-1 min-w-0 pl-2">
          <span data-testid="breadcrumb-segment" class="text-xs text-gray-400">Workspace / Project</span>
        </div>
        <div data-testid="pane-titlebar-toolbar" class="flex items-center gap-2">
          <button class="text-xs px-2 py-1 rounded bg-[#252525]">Actions</button>
        </div>
      </header>

      <!-- Main Body Container -->
      <div data-main-content-body="true" class="flex-1 flex flex-col min-h-0 overflow-hidden relative">
        <div class="flex-1 min-h-0 flex flex-col relative">
          <!-- Conversation View Container -->
          <div data-testid="conversation-view" class="flex flex-col h-full w-full">
            <!-- Child 0: Message Scroller -->
            <div id="child-0-messages" class="relative w-full flex-grow min-h-0 overflow-y-auto p-4 space-y-4">
              <div class="p-3 rounded-lg bg-[#252525]">Message 1: Hello from Antigravity Host!</div>
              <div class="p-3 rounded-lg bg-[#252525]">Message 2: Testing flex-grow invariant behavior.</div>
            </div>
            <!-- Child 1: Composer Box -->
            <div id="child-1-composer" class="relative w-full px-4 pb-2 flex-shrink-0">
              <div class="border border-[#333333] rounded-lg p-2 bg-[#1e1e1e] flex items-center">
                <input type="text" placeholder="Send a message..." class="bg-transparent border-none outline-none w-full text-sm text-white" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Injected AGY Boost Runtime -->
  <script src="../../dist/agy-boost.js"></script>
</body>
</html>
