run:
  timeout: 3m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    - gofmt
    - ineffassign
    - misspell
    - gocyclo
    - goconst
    - unconvert
    - dupword
    - asciicheck
    - bidichk
    - tagalign
    - whitespace
    - dogsled

linters-settings:
  gofmt:
    simplify: true
  gocyclo:
    min-complexity: 25
  goconst:
    min-len: 3
    min-occurrences: 4
  misspell:
    locale: US

issues:
  exclude-dirs:
    - node_modules
    - dist
    - dist-native
  exclude-rules:
    - path: _test\.go
      linters:
        - goconst
        - gocyclo
